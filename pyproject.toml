[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doorlock"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2", "aiohttp>=3.9", "opencv-python-headless>=4.9", "paho-mqtt>=2.0", "PySide6>=6.5"]

[project.optional-dependencies]
npu = ["rknn-toolkit-lite2==2.3.2"]
audio = ["cozepy>=0.20", "av>=12.0", "aiortc>=1.9", "sounddevice>=0.4.6"]
fingerprint = ["adafruit-circuitpython-fingerprint>=2.2.0", "adafruit-blinka>=8.0.0", "pyserial>=3.5"]

[project.scripts]
doorlock = "application:main"

[tool.setuptools]
py-modules = ["application", "process_manager", "event_log"]

[tool.setuptools.packages.find]
where = ["src"]